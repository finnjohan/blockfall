<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="Blockfall – fallande block för Ubuntu Touch">
  <defs>
    <linearGradient id="felt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123b2a"/>
      <stop offset="0.55" stop-color="#0b2a1e"/>
      <stop offset="1" stop-color="#061a12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.62" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#8fe0ad" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8fe0ad" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18" result="blur"/>
      <feOffset in="blur" dx="0" dy="14" result="offset"/>
      <feFlood flood-color="#00170d" flood-opacity="0.55" result="color"/>
      <feComposite in="color" in2="offset" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#felt)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <!-- Fallande block till höger -->
  <g transform="translate(1330 540) rotate(4)" filter="url(#shadow)" stroke="#0b1f16" stroke-width="6">
    <g fill="#40c4ff">
      <rect x="-300" y="-240" width="100" height="100"/>
      <rect x="-200" y="-240" width="100" height="100"/>
      <rect x="-100" y="-240" width="100" height="100"/>
      <rect x="0" y="-240" width="100" height="100"/>
    </g>
    <g fill="#ab47bc">
      <rect x="-200" y="-140" width="100" height="100"/>
      <rect x="-100" y="-140" width="100" height="100"/>
      <rect x="0" y="-140" width="100" height="100"/>
    </g>
    <g fill="#ffd54f">
      <rect x="-100" y="-40" width="100" height="100"/>
      <rect x="0" y="-40" width="100" height="100"/>
    </g>
    <g fill="#66bb6a">
      <rect x="-300" y="60" width="100" height="100"/>
      <rect x="-200" y="60" width="100" height="100"/>
    </g>
    <g fill="#42a5f5">
      <rect x="0" y="60" width="100" height="100"/>
      <rect x="100" y="60" width="100" height="100"/>
    </g>
    <g opacity="0.28" stroke="#8fe0ad" stroke-width="4">
      <rect x="-200" y="160" width="100" height="100" fill="none"/>
      <rect x="-100" y="160" width="100" height="100" fill="none"/>
      <rect x="0" y="160" width="100" height="100" fill="none"/>
    </g>
  </g>

  <g font-family="sans-serif">
    <text x="130" y="430" font-size="160" font-weight="700" fill="#fbfaf3">Blockfall</text>
    <text x="136" y="520" font-size="58" fill="#d8efe0">Lugnt fallande block.</text>
    <text x="138" y="588" font-size="34" fill="#a9cfb6">Svenska och engelska · highscore · nivåer · offline</text>
  </g>

  <rect x="130" y="720" width="220" height="8" rx="4" fill="#8fe0ad" opacity="0.9"/>
  <text x="130" y="890" font-family="sans-serif" font-size="28" fill="#7fae91">Ubuntu Touch · 24.04</text>
</svg>
